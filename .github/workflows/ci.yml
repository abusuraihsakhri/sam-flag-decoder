name: SAM FLAG Decoder CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q sam_flag.py cli.py enrichment.py agents tests
      - name: Run Python tests
        env:
          AUDIT_SECRET_KEY: ci-test-audit-secret-key-2026
        run: python -m pytest -q
      - name: Browser JavaScript unit tests
        if: matrix.python-version == '3.12'
        run: |
          node --version
          npm test
      - name: Audit HMAC tamper smoke
        if: matrix.python-version == '3.12'
        env:
          AUDIT_SECRET_KEY: ci-test-audit-secret-key-2026
        run: |
          python -c "from agents.base import AuditTrail; a=AuditTrail('test'); a.log('actor','tier','event',{'x':1}); a.logs[0]['actor']='forged'; assert not a.verify_integrity()"
